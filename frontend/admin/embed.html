<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能客服</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    /* Transparent, not a solid colour.
       This page is almost always loaded inside an <iframe> that's larger than
       the widget's floating panel. A painted background would fill that extra
       area with a visible block; transparent lets the host page show through,
       so only the widget's own rounded panel and button are seen.
       `?bg=` can restore a colour for standalone use. */
    background: transparent;
  }
  /* The widget floats with position:fixed. Inside this standalone page that's
     exactly what we want — it fills whatever iframe / window hosts us. */
  #hint {
    padding: 40px 24px;
    text-align: center;
    color: #9ca3af;
    font-size: 13px;
    line-height: 1.8;
    /* Give the loading text its own backdrop so it stays readable against
       whatever the host page looks like. */
    background: rgba(255, 255, 255, .92);
    border-radius: 12px;
    margin: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
  }
  #hint code { background: #e5e7eb; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="hint"></div>

<script src="/shared/locale.js"></script>
<script>
(function () {
  // The API base can be passed in via ?api=... (the admin preview does this);
  // otherwise assume the widget is served from the same origin as the backend.
  const params = new URLSearchParams(location.search);
  const apiUrl = params.get('api') || location.origin;

  /* -----------------------------------------------------------------------
     Language
     -----------------------------------------------------------------------
     Resolved before anything is painted, so the loading text is already in the
     visitor's language. Priority: ?lang= (the admin preview passes it) > a
     previously saved manual choice > timezone region > browser language > en.
     All of it offline — see shared/locale.js.
  */
  const L = window.CSLocale;
  // detect() already layers ?lang= over the saved choice, the timezone region
  // and navigator.languages, defaulting to English — all offline.
  const lang = L ? L.detect().locale : 'zh-CN';
  if (L) L.applyHtmlLang(lang);

  const TEXT = {
    'zh-CN': {
      title: '智能客服',
      loading: '正在加载客服组件…<br>如果长时间没反应，请检查浏览器控制台。',
      failed: '❌ 无法加载 <code>customer-service.js</code><br>请确认后端已挂载 <code>/widget</code> 静态目录。',
    },
    'zh-TW': {
      title: '智能客服',
      loading: '正在載入客服元件…<br>如果長時間沒反應，請檢查瀏覽器主控台。',
      failed: '❌ 無法載入 <code>customer-service.js</code><br>請確認後端已掛載 <code>/widget</code> 靜態目錄。',
    },
    ja: {
      title: 'AIカスタマーサポート',
      loading: 'サポートウィジェットを読み込み中…<br>反応がない場合はブラウザのコンソールを確認してください。',
      failed: '❌ <code>customer-service.js</code> を読み込めません<br>バックエンドで <code>/widget</code> 静的ディレクトリがマウントされているか確認してください。',
    },
    en: {
      title: 'Customer Service',
      loading: 'Loading the support widget…<br>If nothing happens, check the browser console.',
      failed: '❌ Could not load <code>customer-service.js</code><br>Check that the backend serves the <code>/widget</code> static directory.',
    },
  };
  const S = TEXT[lang] || TEXT['zh-CN'];
  document.title = S.title;
  document.getElementById('hint').innerHTML = S.loading;

  // Only forward options the URL actually specified. Passing a default for
  // e.g. `title` would mark it as caller-supplied, and the widget would then
  // refuse to sync 客服名称 from GET /api/config/public — leaving the admin
  // console's value silently ignored.
  const opts = { apiUrl: apiUrl, lang: lang };
  const pass = (name, key, transform) => {
    const raw = params.get(name);
    if (raw !== null && raw !== '') opts[key] = transform ? transform(raw) : raw;
  };
  pass('title', 'title');
  pass('accent', 'accent');
  pass('position', 'position');
  pass('avatar', 'avatar');
  pass('welcome', 'welcome');
  opts.autoOpen = params.get('autoOpen') !== '0';
  // Opt-in, not opt-out: /api/documents/upload requires an admin token, so a
  // visitor pressing the paperclip would only ever get a 401. `?upload=1` is
  // left in for anyone who has put an authenticated proxy in front of it.
  opts.enableUpload = params.get('upload') === '1';

  // The page is transparent by default so an oversized iframe doesn't show a
  // block of colour. `?bg=` paints one back when this page is opened directly
  // or hosted in a preview pane that wants a backdrop.
  //   ?bg=f4f6f9   → #f4f6f9      ?bg=%23fff → #fff
  const bg = params.get('bg');
  if (bg) {
    // 只接受十六进制颜色（带不带 # 都行）；其它值直接忽略，而不是原样
    // 塞进 style.background —— URL 参数是任意的访客输入。
    const hex = bg.replace(/^#/, '');
    if (/^[0-9a-f]{3,8}$/i.test(hex)) {
      document.documentElement.style.background = '#' + hex;
    }
  }

  const s = document.createElement('script');
  // Cache-bust so an edited widget never renders from a stale copy. The
  // backend also sends Cache-Control: no-cache for /widget, but a query
  // param additionally defeats offline / service-worker caches.
  const bust = params.get('v') || Date.now();
  s.src = '../widget/customer-service.js?v=' + bust;
  s.onload = function () {
    document.getElementById('hint').style.display = 'none';
    window.CustomerService.init(opts);
  };
  s.onerror = function () {
    document.getElementById('hint').innerHTML = S.failed;
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
