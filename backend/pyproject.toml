[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-customer-service"
# 全项目唯一的版本号来源。发版时只改这一行，然后打 tag v<同样的号>。
# 这里不写 v 前缀：PEP 440 的规范写法不带 v，打包时会被去掉。展示给用户的
# "vX.Y.Z" 由 core/config.py 的 _version_from_pyproject() 统一加上。
version = "1.3.0"
description = "Document-aware multi-model customer service platform with RAG."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "rgh" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]
